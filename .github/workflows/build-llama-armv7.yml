name: Build llama.cpp for Android ARMv7

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-armv7:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Qwen35App
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: false
          log-accepted-android-sdk-licenses: false

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Install Android NDK and CMake
        shell: bash
        run: |
          sdkmanager "platform-tools" \
                     "platforms;android-35" \
                     "build-tools;35.0.0" \
                     "cmake;3.31.5" \
                     "ndk;27.2.12479018"

      - name: Verify Android toolchain
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-35|build-tools;35.0.0|cmake;3.31.5|ndk;27.2.12479018' || true
          test -d "$ANDROID_NDK_HOME"

      - name: Clone llama.cpp
        shell: bash
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git llama.cpp

      - name: Configure llama.cpp for ARMv7
        shell: bash
        run: |
          cmake -S llama.cpp -B llama.cpp/build-armv7 \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-29 \
            -DANDROID_STL=c++_shared \
            -DGGML_OPENMP=OFF \
            -DGGML_NATIVE=OFF \
            -DLLAMA_BUILD_TESTS=OFF \
            -DLLAMA_BUILD_EXAMPLES=ON \
            -DLLAMA_BUILD_SERVER=ON

      - name: Build llama.cpp
        shell: bash
        run: |
          cmake --build llama.cpp/build-armv7 \
            --config Release \
            --parallel 2

      - name: Package ARMv7 native libraries
        shell: bash
        run: |
          mkdir -p app/src/main/jniLibs/armeabi-v7a
          find llama.cpp/build-armv7 -type f \
            \( -name '*.so' -o -name 'llama-cli' -o -name 'llama-server' \) \
            -print

      - name: Build Android project
        shell: bash
        run: |
          chmod +x ./gradlew 2>/dev/null || true
          if [ -f ./gradlew ]; then
            ./gradlew assembleDebug
          else
            echo "Gradle wrapper não está presente no projeto."
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Qwen35App-ARMv7-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
