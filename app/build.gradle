plugins {
    id 'com.android.application'
}

android {
    namespace 'com.nexus.qwen'
    compileSdk 35

    defaultConfig {
        applicationId 'com.nexus.qwen'
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        ndk {
            abiFilters 'armeabi-v7a'
        }

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17 -O2'
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
